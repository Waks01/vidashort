<?xml version="1.0" encoding="UTF-8"?>
<!--
  app-icon-iii-film.svg — STOPGAP / alt app icon concept (archive only).
  Film-strip / clapperboard motif. Not rendered in any HTML.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#ff4d80"/>
      <stop offset="55%" stop-color="#ff1f5a"/>
      <stop offset="100%" stop-color="#b3002b"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>
  <!-- Clapperboard body -->
  <rect x="192" y="380" width="640" height="440" fill="#1a0a0e"/>
  <!-- Clapper arm (top stripe) -->
  <polygon points="192,380 832,380 832,300 192,300" fill="#1a0a0e"/>
  <polygon points="192,380 832,300 832,330 192,410" fill="#0a0608"/>
  <!-- Diagonal stripes on the arm -->
  <polygon points="252,300 312,300 312,380 252,380" fill="#f5e9d4"/>
  <polygon points="432,300 492,300 492,370 432,370" fill="#f5e9d4"/>
  <polygon points="612,300 672,300 672,360 612,360" fill="#f5e9d4"/>
  <polygon points="792,300 832,300 832,355 792,355" fill="#f5e9d4"/>
  <!-- Play triangle in body -->
  <polygon points="432,500 432,700 632,600" fill="#ff1f5a"/>
</svg>