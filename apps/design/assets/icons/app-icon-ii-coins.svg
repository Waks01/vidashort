<?xml version="1.0" encoding="UTF-8"?>
<!--
  app-icon-ii-coins.svg — STOPGAP / alt app icon concept (archive only).
  Stack-of-coins motif. Not rendered in any HTML.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#ff4d80"/>
      <stop offset="55%" stop-color="#ff1f5a"/>
      <stop offset="100%" stop-color="#b3002b"/>
    </linearGradient>
    <radialGradient id="coin" cx="35%" cy="30%" r="65%">
      <stop offset="0%"  stop-color="#ffe27a"/>
      <stop offset="60%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>
  <!-- Stack of 3 coins -->
  <ellipse cx="512" cy="700" rx="320" ry="60" fill="url(#coin)"/>
  <rect x="192" y="500" width="640" height="200" fill="url(#coin)"/>
  <ellipse cx="512" cy="500" rx="320" ry="60" fill="#ffe27a"/>
  <ellipse cx="512" cy="400" rx="280" ry="50" fill="url(#coin)"/>
  <rect x="232" y="240" width="560" height="160" fill="url(#coin)"/>
  <ellipse cx="512" cy="240" rx="280" ry="50" fill="#ffe27a"/>
  <!-- Coin face glyph: $ -->
  <text x="512" y="370" font-family="sans-serif" font-size="180" font-weight="800" fill="#8b6914" text-anchor="middle">$</text>
</svg>