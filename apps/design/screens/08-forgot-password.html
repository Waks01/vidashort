<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0608">
  <title>vidashort — Forgot password</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/app-icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <style>
    .forgot { height: 100%; display: flex; flex-direction: column; padding: 0 24px; }
    .forgot__top { padding: 56px 0 24px; }
    .forgot__back { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--color-text-1); cursor: pointer; margin-bottom: 16px; }
    .forgot__title { font-family: var(--font-display); font-weight: 800; font-style: italic; font-size: var(--text-2xl); margin-bottom: 8px; }
    .forgot__sub { color: var(--color-text-2); font-size: var(--text-sm); line-height: 1.5; max-width: 320px; }
    .forgot__form { flex: 1; display: flex; flex-direction: column; gap: 16px; padding-top: 32px; }
    .forgot__actions { padding: 16px 0 32px; }
    .forgot__sent { display: none; flex-direction: column; align-items: center; text-align: center; padding: 32px 0; gap: 16px; }
    .forgot__sent-icon { width: 80px; height: 80px; display: grid; place-items: center; background: var(--color-success); border-radius: 50%; color: white; font-size: 40px; }
  </style>
</head>
<body>
  <main class="screen" data-direction="forward">
    <div class="forgot">
      <div class="forgot__top">
        <div class="forgot__back" data-nav="back"><i class="ph ph-arrow-left" style="font-size:22px;"></i></div>
        <h1 class="forgot__title">Forgot your password?</h1>
        <p class="forgot__sub">Enter your email and we'll send you a reset link.</p>
      </div>

      <form class="forgot__form" id="form" autocomplete="off">
        <div>
          <label class="label" for="email">Email</label>
          <div class="input-group">
            <i class="ph ph-envelope input-group__icon"></i>
            <input class="input input--with-icon" id="email" type="email" placeholder="you@example.com" required>
          </div>
        </div>
      </form>

      <div class="forgot__sent" id="sent">
        <div class="forgot__sent-icon"><i class="ph-bold ph-paper-plane-tilt"></i></div>
        <div>
          <h3 style="font-family:var(--font-display); font-style:italic; font-size:var(--text-xl); margin-bottom:8px;">Check your inbox</h3>
          <p style="color:var(--color-text-2); font-size:var(--text-sm); max-width:280px; margin:0 auto;">We sent a password reset link to <span id="sentEmail" style="color:var(--color-text-1); font-weight:600;"></span></p>
        </div>
      </div>

      <div class="forgot__actions">
        <button class="btn btn--primary btn--lg btn--block" id="submit">Send reset link</button>
      </div>
    </div>
  </main>

  <script src="../scripts/data.js"></script>
  <script src="../scripts/app.js"></script>
  <script>
    document.getElementById('submit').addEventListener('click', () => {
      const email = document.getElementById('email').value.trim();
      if (!email || !email.includes('@')) {
        vidashort.Toast.show('Enter a valid email', 'error');
        vidashort.Haptics.error();
        return;
      }
      document.getElementById('submit').setAttribute('aria-busy', 'true');
      setTimeout(() => {
        document.getElementById('form').style.display = 'none';
        document.getElementById('sent').style.display = 'flex';
        document.getElementById('sentEmail').textContent = email;
        document.getElementById('submit').style.display = 'none';
        vidashort.Haptics.success();
        vidashort.Toast.show('Reset link sent', 'success');
        // After 2s, offer to go to OTP screen for demo
        setTimeout(() => {
          document.getElementById('submit').style.display = '';
          document.getElementById('submit').textContent = 'Enter the code instead';
          document.getElementById('submit').removeAttribute('aria-busy');
          document.getElementById('submit').onclick = () => vidashort.Router.go('./09-otp.html');
        }, 1500);
      }, 800);
    });
    document.querySelector('[data-nav="back"]').addEventListener('click', () => vidashort.Router.back());
  </script>
</body>
</html>
