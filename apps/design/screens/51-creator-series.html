<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0608">
  <title>vidashort — My series</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/app-icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <style>
    body { padding-top: 56px; padding-bottom: 72px; }
    .ms { padding: 0 20px; }
    .ms__head { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 8px; }
    .ms__title { font-family: var(--font-display); font-weight: 800; font-style: italic; font-size: var(--text-xl); }
    .ms__filter { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 16px; scrollbar-width: none; }
    .ms__filter::-webkit-scrollbar { display: none; }
    .ms__card { background: var(--color-bg-elev-1); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 12px; display: flex; gap: 12px; margin-bottom: 10px; cursor: pointer; }
    .ms__card:hover { border-color: var(--color-border-strong); }
    .ms__thumb { width: 64px; height: 92px; border-radius: var(--radius-sm); background-size: cover; background-position: center; flex-shrink: 0; }
    .ms__body { flex: 1; min-width: 0; }
    .ms__name { font-weight: 700; font-size: var(--text-base); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ms__meta { font-size: 11px; color: var(--color-text-3); display: flex; gap: 6px; margin-top: 4px; }
    .ms__stat-row { display: flex; gap: 12px; margin-top: 8px; }
    .ms__stat { font-size: 11px; color: var(--color-text-2); }
    .ms__stat-val { color: var(--color-text-1); font-weight: 700; }
    .ms__pill { display: inline-block; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; padding: 2px 6px; border-radius: 4px; }
    .ms__pill--approved { background: rgba(46, 212, 122, 0.15); color: var(--color-success); }
    .ms__pill--pending  { background: rgba(255, 182, 72, 0.15); color: var(--color-warning); }
    .ms__pill--rejected { background: rgba(255, 56, 56, 0.15); color: var(--color-error); }
    .ms__pill--draft    { background: rgba(180, 169, 154, 0.15); color: var(--color-text-2); }
    .ms__empty { text-align: center; padding: 48px 24px; color: var(--color-text-2); }
    .ms__empty i { font-size: 64px; color: var(--color-text-3); margin-bottom: 16px; }
  </style>
</head>
<body>
  <div id="chrome-topbar" data-title="My series"></div>
  <div id="chrome-bottomnav"></div>

  <main class="screen" data-direction="forward">
    <div class="ms">
      <div class="ms__head">
        <div class="ms__title">All series</div>
        <button class="btn btn--primary btn--sm" data-nav="upload"><i class="ph ph-plus"></i> New</button>
      </div>
      <div class="ms__filter">
        <button class="chip chip--selected">All</button>
        <button class="chip">Approved</button>
        <button class="chip">Pending</button>
        <button class="chip">Rejected</button>
        <button class="chip">Drafts</button>
      </div>
      <div id="list"></div>
    </div>
  </main>

  <script src="../scripts/data.js"></script>
  <script src="../scripts/app.js"></script>
  <script src="../scripts/chrome.js"></script>
  <script>
    if (!vidashort.Auth.requireRole('creator')) {}
    const profile = vidashort.Storage.getCreatorProfile() || vidashort.MockData.creators[0];
    const mySeries = vidashort.Storage.getCreatorSeries().length
      ? vidashort.Storage.getCreatorSeries()
      : vidashort.MockData.creatorSeries.filter(s => s.creatorId === profile.id);

    const list = document.getElementById('list');
    if (!mySeries.length) {
      list.innerHTML = `
        <div class="ms__empty">
          <i class="ph-duotone ph-film-strip"></i>
          <div style="font-family:var(--font-display); font-style:italic; font-size:var(--text-lg); margin-bottom:8px;">No series yet</div>
          <div style="font-size:var(--text-sm); margin-bottom:24px;">Upload your first microdrama and start earning 60% of every paid unlock.</div>
          <button class="btn btn--primary" data-nav="upload">Upload series</button>
        </div>
      `;
    } else {
      list.innerHTML = mySeries.map(s => `
        <div class="ms__card" data-nav="upload">
          <div class="ms__thumb" style="background-image:url('${s.cover}')"></div>
          <div class="ms__body">
            <div class="ms__name">${s.title}</div>
            <div class="ms__meta">
              <span>${s.totalEpisodes} ep</span>
              <span>•</span>
              <span>${s.category}</span>
            </div>
            <div style="margin-top:6px;"><span class="ms__pill ms__pill--${s.moderationStatus}">${s.moderationStatus}</span></div>
            <div class="ms__stat-row">
              <div class="ms__stat"><span class="ms__stat-val">${(s.views || 0).toLocaleString()}</span> views</div>
              <div class="ms__stat"><span class="ms__stat-val">₦${((s.loyaltyCoins || 0) / 10).toLocaleString()}</span> earned</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    document.querySelectorAll('[data-nav="upload"]').forEach(el => el.addEventListener('click', () => vidashort.Router.go('./52-creator-upload.html')));
  </script>
</body>
</html>
