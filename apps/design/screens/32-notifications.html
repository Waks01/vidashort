<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0608">
  <title>vidashort — Notifications</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/app-icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <style>
    body { padding-top: 56px; padding-bottom: 72px; overflow-y: auto; }
    .nt { padding: 0 20px; }
    .nt__title { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: var(--text-xl); padding: 16px 0 4px; }
    .nt__sub { color: var(--color-text-2); font-size: var(--text-sm); margin-bottom: 16px; }
    .nt__group { margin-bottom: 16px; }
    .nt__group-title { font-size: 10px; font-weight: 800; color: var(--color-text-3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    .nt__card { display: flex; gap: 12px; align-items: flex-start; background: var(--color-bg-elev-1); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 14px; margin-bottom: 8px; cursor: pointer; transition: background var(--duration-fast); }
    .nt__card:hover { background: var(--color-bg-elev-2); }
    .nt__card--unread { border-color: var(--color-accent-1); }
    .nt__icon { width: 40px; height: 40px; border-radius: 50%; background: var(--color-bg-elev-2); display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }
    .nt__icon--episode { color: var(--color-accent-1); }
    .nt__icon--reward  { color: var(--color-gold-1); }
    .nt__icon--streak  { color: var(--color-warning); }
    .nt__icon--system  { color: var(--color-text-2); }
    .nt__body { flex: 1; }
    .nt__text { font-size: var(--text-sm); line-height: 1.5; }
    .nt__text strong { color: var(--color-text-1); }
    .nt__time { font-size: 11px; color: var(--color-text-3); margin-top: 4px; }
    .nt__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-accent-1); align-self: center; flex-shrink: 0; }
    .nt__empty { text-align: center; padding: 48px 24px; color: var(--color-text-2); }
    .nt__empty i { font-size: 64px; color: var(--color-text-3); margin-bottom: 12px; display: block; }
  </style>
</head>
<body>
  <div id="chrome-topbar" data-title="Notifications" data-back="true"></div>
  <div id="chrome-bottomnav"></div>

  <main class="screen" data-direction="forward">
    <div class="nt">
      <div class="nt__title">Notifications</div>
      <div class="nt__sub">New episodes, rewards, and account activity.</div>

      <div class="nt__group">
        <div class="nt__group-title">New</div>
        <div id="unread"></div>
      </div>

      <div class="nt__group">
        <div class="nt__group-title">Earlier</div>
        <div id="read"></div>
      </div>
    </div>
  </main>

  <script src="../scripts/data.js"></script>
  <script src="../scripts/app.js"></script>
  <script src="../scripts/chrome.js"></script>
  <script>
    function iconFor(type) {
      if (type === 'episode') return { cls: 'nt__icon--episode', icon: 'film-strip' };
      if (type === 'reward')  return { cls: 'nt__icon--reward',  icon: 'coins' };
      if (type === 'streak')  return { cls: 'nt__icon--streak',  icon: 'fire' };
      return { cls: 'nt__icon--system', icon: 'info' };
    }
    function row(n) {
      const m = iconFor(n.type);
      return `
        <div class="nt__card ${n.unread ? 'nt__card--unread' : ''}">
          <div class="nt__icon ${m.cls}"><i class="ph-bold ph-${m.icon}"></i></div>
          <div class="nt__body">
            <div class="nt__text">${n.seriesTitle ? '<strong>'+n.seriesTitle+'</strong> • ' : ''}${n.body}</div>
            <div class="nt__time">${n.timeAgo}</div>
          </div>
          ${n.unread ? '<div class="nt__dot"></div>' : ''}
        </div>
      `;
    }
    const all = vidashort.MockData.sampleNotifications;
    document.getElementById('unread').innerHTML = all.filter(n => n.unread).map(row).join('') || '<div class="nt__empty"><i class="ph-duotone ph-bell-slash"></i><div>You\'re all caught up 🎉</div></div>';
    document.getElementById('read').innerHTML   = all.filter(n => !n.unread).map(row).join('') || '<div style="text-align:center; color:var(--color-text-3); font-size:13px; padding:16px 0;">No earlier notifications.</div>';

    // Tap a card to mark as read
    document.querySelectorAll('.nt__card').forEach(c => c.addEventListener('click', () => {
      c.classList.remove('nt__card--unread');
      const dot = c.querySelector('.nt__dot');
      if (dot) dot.remove();
    }));
  </script>
</body>
</html>
