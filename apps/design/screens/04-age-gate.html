<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0608">
  <title>vidashort — Age verification</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/app-icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <style>
    .age {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 32px;
      text-align: center;
    }
    .age__icon {
      width: 96px;
      height: 96px;
      display: grid;
      place-items: center;
      background: var(--gradient-accent);
      border-radius: 50%;
      font-size: 48px;
      color: white;
      box-shadow: var(--glow-magenta);
      margin-bottom: 32px;
    }
    .age__title {
      font-family: var(--font-display);
      font-weight: 900;
      font-style: italic;
      font-size: var(--text-3xl);
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .age__sub {
      color: var(--color-text-2);
      font-size: var(--text-base);
      line-height: 1.5;
      max-width: 320px;
      margin-bottom: 48px;
    }
    .age__actions {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .age__legal {
      font-size: var(--text-xs);
      color: var(--color-text-3);
      margin-top: 24px;
      line-height: 1.5;
      max-width: 280px;
    }
  </style>
</head>
<body>
  <main class="screen" data-direction="forward">
    <div class="age">
      <div class="age__icon"><i class="ph-fill ph-shield-check"></i></div>
      <h1 class="age__title">Are you 17 or older?</h1>
      <p class="age__sub">vidashort is for adults. Some content is intended for mature audiences.</p>
      <div class="age__actions">
        <button class="btn btn--primary btn--lg btn--block" id="yes">Yes, I'm 17 or older</button>
        <button class="btn btn--ghost btn--block" id="no">No, I'm under 17</button>
      </div>
      <p class="age__legal">By continuing you confirm that you are at least 17 years of age and agree to our Terms of Service and Privacy Policy.</p>
    </div>
  </main>

  <script src="../scripts/data.js"></script>
  <script src="../scripts/app.js"></script>
  <script>
    document.getElementById('yes').addEventListener('click', () => {
      vidashort.Storage.setAgeConfirmed();
      vidashort.Haptics.success();
      // Continue onboarding flow if not yet onboarded
      if (!vidashort.Storage.isOnboarded()) {
        vidashort.Router.go('./01-onboarding.html');
      } else {
        vidashort.Router.go('./05-auth-entry.html');
      }
    });
    document.getElementById('no').addEventListener('click', () => {
      vidashort.Modal.open(`
        <div class="modal__header">
          <div class="modal__title">Sorry, you must be 17+</div>
        </div>
        <div class="modal__body">
          <p style="color:var(--color-text-2); font-size:14px; line-height:1.5;">vidashort is intended for adult audiences. You must be at least 17 years old to use this app.</p>
        </div>
        <div class="modal__footer">
          <button class="btn btn--secondary btn--block" onclick="vidashort.Modal.close()">Close</button>
        </div>
      `, { dismissable: true });
    });
  </script>
</body>
</html>
