<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0608">
  <title>vidashort — Comments</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/app-icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <style>
    body { padding: 0; overflow: hidden; background: rgba(0,0,0,0.6); }
    .cm { position: fixed; inset: 0; display: flex; flex-direction: column; z-index: 100; }
    .cm__scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.5); }
    .cm__sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 75vh; background: var(--color-bg-elev-1); border-top-left-radius: 20px; border-top-right-radius: 20px; display: flex; flex-direction: column; }
    .cm__grab { width: 36px; height: 4px; background: var(--color-border-strong); border-radius: 2px; margin: 8px auto; }
    .cm__title-row { display: flex; align-items: center; justify-content: space-between; padding: 0 20px 8px; }
    .cm__title { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: var(--text-md); }
    .cm__close { color: var(--color-text-2); font-size: 20px; padding: 4px; cursor: pointer; }
    .cm__tabs { display: flex; gap: 16px; padding: 0 20px 12px; border-bottom: 1px solid var(--color-border); }
    .cm__tab { font-weight: 700; font-size: 12px; color: var(--color-text-3); padding-bottom: 8px; cursor: pointer; }
    .cm__tab--active { color: var(--color-text-1); border-bottom: 2px solid var(--color-accent-1); }
    .cm__list { flex: 1; overflow-y: auto; padding: 12px 20px; }
    .cm__row { display: flex; gap: 10px; margin-bottom: 14px; }
    .cm__avatar { width: 32px; height: 32px; border-radius: 50%; background-size: cover; flex-shrink: 0; }
    .cm__body { flex: 1; }
    .cm__name { font-weight: 800; font-size: 12px; color: var(--color-text-1); }
    .cm__time { font-size: 10px; color: var(--color-text-3); margin-left: 6px; }
    .cm__text { font-size: 13px; line-height: 1.45; margin-top: 4px; color: var(--color-text-2); }
    .cm__text b { color: var(--color-text-1); }
    .cm__actions { display: flex; gap: 14px; margin-top: 6px; color: var(--color-text-3); font-size: 11px; }
    .cm__actions span { cursor: pointer; }
    .cm__input { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--color-border); background: var(--color-bg-elev-2); }
    .cm__input input { flex: 1; background: var(--color-bg-elev-1); border: 1px solid var(--color-border); color: var(--color-text-1); border-radius: 999px; padding: 8px 14px; font-size: 13px; outline: none; }
    .cm__input button { background: var(--gradient-accent); color: white; border-radius: 999px; padding: 8px 16px; font-weight: 800; font-size: 12px; }
  </style>
</head>
<body>
  <div class="cm">
    <div class="cm__scrim" id="scrim"></div>
    <div class="cm__sheet">
      <div class="cm__grab"></div>
      <div class="cm__title-row">
        <div class="cm__title" id="ct">387 comments</div>
        <i class="ph ph-x cm__close" id="close"></i>
      </div>
      <div class="cm__tabs">
        <div class="cm__tab cm__tab--active" data-tab="top">Top</div>
        <div class="cm__tab" data-tab="new">New</div>
      </div>
      <div class="cm__list" id="list"></div>
      <div class="cm__input">
        <input placeholder="Add a comment…">
        <button>Post</button>
      </div>
    </div>
  </div>

  <script src="../scripts/data.js"></script>
  <script src="../scripts/app.js"></script>
  <script src="../scripts/chrome.js"></script>
  <script>
    const comments = vidashort.MockData.comments || [];
    function row(c) {
      return `
        <div class="cm__row">
          <div class="cm__avatar" style="background-image:url('${c.avatar}')"></div>
          <div class="cm__body">
            <div><span class="cm__name">${c.name}</span><span class="cm__time">${c.timeAgo}</span></div>
            <div class="cm__text">${c.body}</div>
            <div class="cm__actions"><span><i class="ph-bold ph-heart"></i> ${c.likes}</span><span>Reply</span></div>
          </div>
        </div>
      `;
    }
    document.getElementById('list').innerHTML = comments.length ? comments.map(row).join('') : '<div class="empty-state" style="padding:32px 0;">Be the first to comment.</div>';
    document.getElementById('ct').textContent = comments.length + ' comments';
    document.getElementById('scrim').addEventListener('click', () => history.back());
    document.getElementById('close').addEventListener('click', () => history.back());
  </script>
</body>
</html>
