<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0608">
  <title>vidashort — Welcome</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/app-icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <style>
    .onboarding {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .onboarding__slides {
      flex: 1;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    .onboarding__slides::-webkit-scrollbar { display: none; }
    .onboarding__slide {
      flex: 0 0 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px 32px 40px;
    }
    .onboarding__skip {
      position: absolute;
      top: 56px;
      right: 24px;
      z-index: 10;
      padding: 8px 14px;
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--color-text-1);
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-pill);
      cursor: pointer;
    }
    .onboarding__art {
      flex: 1;
      display: grid;
      place-items: center;
      position: relative;
    }
    .onboarding__copy {
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .onboarding__title {
      font-family: var(--font-display);
      font-weight: 900;
      font-style: italic;
      font-size: var(--text-4xl);
      line-height: 1.05;
      letter-spacing: var(--tracking-tight);
      margin-bottom: var(--space-3);
    }
    .onboarding__sub {
      font-size: var(--text-md);
      color: var(--color-text-2);
      max-width: 280px;
      margin: 0 auto;
      line-height: 1.4;
    }
    .onboarding__dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 24px 0;
    }
    .onboarding__dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-text-3);
      transition: all var(--duration-base) var(--ease-out);
    }
    .onboarding__dot--active {
      width: 24px;
      background: var(--color-accent-1);
      box-shadow: var(--glow-magenta);
    }
    .onboarding__actions {
      padding: 0 24px 32px;
    }
    /* Slide-specific art */
    .slide-1 { background: linear-gradient(160deg, #2a0a18 0%, var(--color-accent-2) 50%, var(--color-accent-1) 100%); }
    .slide-1::before {
      content: '';
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
      opacity: 0.4;
      pointer-events: none;
    }
    .slide-2 { background: linear-gradient(160deg, #1a0008 0%, #4a0014 50%, var(--color-accent-1) 100%); }
    .slide-3 { background: linear-gradient(160deg, #2a1a08 0%, #8b6914 50%, var(--color-gold-1) 100%); }

    /* Abstract CSS art per slide */
    .art-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.5;
    }
    .art-ring {
      position: absolute;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
    }
    .art-square {
      position: absolute;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
    }
    .art-coin {
      width: 80px;
      height: 80px;
      background: var(--gradient-coin);
      border-radius: 50%;
      box-shadow: 0 0 60px rgba(255, 200, 80, 0.5), inset 0 0 0 2px var(--color-gold-3);
      position: absolute;
    }
    .art-play {
      width: 0;
      height: 0;
      border-left: 40px solid rgba(255, 255, 255, 0.9);
      border-top: 25px solid transparent;
      border-bottom: 25px solid transparent;
      filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.5));
      position: absolute;
    }
  </style>
</head>
<body>
  <main class="screen" data-direction="forward">
    <div class="onboarding">
      <div class="onboarding__skip" id="skip">Skip</div>

      <div class="onboarding__slides" id="slides">
        <!-- Slide 1: Endless Drama -->
        <div class="onboarding__slide slide-1">
          <div class="onboarding__art">
            <div class="art-shape" style="width:280px;height:280px;background:#ff1f5a;top:10%;left:-10%;"></div>
            <div class="art-shape" style="width:200px;height:200px;background:#ffe27a;bottom:20%;right:-5%;"></div>
            <div class="art-ring" style="width:180px;height:180px;top:25%;right:15%;"></div>
            <div class="art-ring" style="width:240px;height:240px;bottom:15%;left:20%;"></div>
            <div class="art-square" style="width:80px;height:80px;top:40%;left:10%;transform:rotate(15deg);"></div>
            <div class="art-square" style="width:50px;height:50px;bottom:30%;right:25%;transform:rotate(-25deg);"></div>
          </div>
          <div class="onboarding__copy">
            <h1 class="onboarding__title">Endless Drama.</h1>
            <p class="onboarding__sub">Thousands of bite-sized episodes across every genre you love.</p>
          </div>
        </div>

        <!-- Slide 2: Watch Anywhere -->
        <div class="onboarding__slide slide-2">
          <div class="onboarding__art">
            <div class="art-shape" style="width:300px;height:300px;background:#b3002b;top:-10%;right:-10%;"></div>
            <div class="art-shape" style="width:200px;height:200px;background:#ff4d80;bottom:10%;left:0;"></div>
            <div class="art-play" style="top:50%;left:50%;transform:translate(-50%,-50%);"></div>
            <div class="art-ring" style="width:160px;height:160px;top:30%;left:15%;"></div>
            <div class="art-ring" style="width:220px;height:220px;bottom:20%;right:10%;"></div>
          </div>
          <div class="onboarding__copy">
            <h1 class="onboarding__title">Watch Anywhere.</h1>
            <p class="onboarding__sub">Stream on your phone. Download for offline. Pick up right where you left off.</p>
          </div>
        </div>

        <!-- Slide 3: Earn Rewards -->
        <div class="onboarding__slide slide-3">
          <div class="onboarding__art">
            <div class="art-shape" style="width:280px;height:280px;background:#ffe27a;top:0;left:50%;transform:translateX(-50%);"></div>
            <div class="art-coin" style="top:30%;left:20%;"></div>
            <div class="art-coin" style="top:50%;left:55%;width:100px;height:100px;"></div>
            <div class="art-coin" style="top:25%;right:20%;width:60px;height:60px;"></div>
            <div class="art-ring" style="width:200px;height:200px;bottom:15%;left:50%;transform:translateX(-50%);border-color:rgba(255,255,255,0.25);"></div>
          </div>
          <div class="onboarding__copy">
            <h1 class="onboarding__title">Earn Rewards.</h1>
            <p class="onboarding__sub">Daily check-ins, free coins, and exclusive VIP perks — every day.</p>
          </div>
        </div>
      </div>

      <div class="onboarding__dots" id="dots">
        <div class="onboarding__dot onboarding__dot--active"></div>
        <div class="onboarding__dot"></div>
        <div class="onboarding__dot"></div>
      </div>

      <div class="onboarding__actions">
        <button class="btn btn--primary btn--lg btn--block" id="next">Next</button>
      </div>
    </div>
  </main>

  <script src="../scripts/data.js"></script>
  <script src="../scripts/app.js"></script>
  <script>
    const slidesEl = document.getElementById('slides');
    const dots = document.querySelectorAll('.onboarding__dot');
    const nextBtn = document.getElementById('next');
    const skipBtn = document.getElementById('skip');
    let currentSlide = 0;

    function update(slide) {
      currentSlide = slide;
      dots.forEach((d, i) => d.classList.toggle('onboarding__dot--active', i === slide));
      nextBtn.textContent = slide === 2 ? 'Get Started' : 'Next';
    }

    slidesEl.addEventListener('scroll', () => {
      const slide = Math.round(slidesEl.scrollLeft / slidesEl.clientWidth);
      if (slide !== currentSlide) update(slide);
    });

    nextBtn.addEventListener('click', () => {
      if (currentSlide < 2) {
        slidesEl.scrollTo({ left: (currentSlide + 1) * slidesEl.clientWidth, behavior: 'smooth' });
      } else {
        vidashort.Storage.setOnboarded();
        vidashort.Router.go('./02-genre-picker.html');
      }
    });

    skipBtn.addEventListener('click', () => {
      vidashort.Storage.setOnboarded();
      vidashort.Router.go('./02-genre-picker.html');
    });
  </script>
</body>
</html>
