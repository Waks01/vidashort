<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0608">
  <title>vidashort — Finance & payouts</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/app-icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <style>
    body { padding-top: 56px; padding-bottom: 72px; }
    .fn { padding: 0 20px; }
    .fn__title { font-family: var(--font-display); font-weight: 800; font-style: italic; font-size: var(--text-xl); padding: 16px 0 4px; }
    .fn__revenue { background: var(--gradient-gold); color: #1a0e00; border-radius: var(--radius-lg); padding: 20px; margin: 12px 0 16px; }
    .fn__revenue-label { font-size: var(--text-xs); letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; font-weight: 700; }
    .fn__revenue-val { font-weight: 800; font-size: 36px; line-height: 1.1; margin: 4px 0; font-variant-numeric: tabular-nums; }
    .fn__revenue-sub { font-size: var(--text-sm); opacity: 0.7; }
    .fn__revenue-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.1); }
    .fn__revenue-cell-val { font-weight: 800; font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
    .fn__revenue-cell-lbl { font-size: 9px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
    .fn__section { margin: 20px 0 8px; }
    .fn__section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .fn__section-title h2 { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: var(--text-lg); }
    .fn__payout { background: var(--color-bg-elev-1); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 14px; margin-bottom: 8px; }
    .fn__payout-head { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    .fn__payout-avatar { width: 36px; height: 36px; border-radius: 50%; background-size: cover; flex-shrink: 0; }
    .fn__payout-body { flex: 1; }
    .fn__payout-name { font-weight: 700; font-size: var(--text-sm); }
    .fn__payout-detail { font-size: 11px; color: var(--color-text-3); margin-top: 2px; }
    .fn__payout-amt { text-align: right; }
    .fn__payout-amt-val { font-weight: 800; font-size: var(--text-base); color: var(--color-gold-1); font-variant-numeric: tabular-nums; }
    .fn__payout-amt-lbl { font-size: 10px; color: var(--color-text-3); text-transform: uppercase; letter-spacing: 0.08em; }
    .fn__payout-actions { display: flex; gap: 8px; }
    .fn__payout-btn { flex: 1; padding: 8px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; border: none; }
    .fn__payout-btn--approve { background: var(--color-success); color: white; }
    .fn__payout-btn--reject  { background: rgba(255, 56, 56, 0.15); color: var(--color-error); border: 1px solid rgba(255, 56, 56, 0.4); }
    .fn__ledger { background: var(--color-bg-elev-1); border: 1px solid var(--color-border); border-radius: var(--radius-md); }
    .fn__ledger-row { display: grid; grid-template-columns: 60px 1fr auto; gap: 12px; padding: 12px; align-items: center; border-bottom: 1px solid var(--color-border); }
    .fn__ledger-row:last-child { border-bottom: none; }
    .fn__ledger-type { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 6px; border-radius: 4px; text-align: center; }
    .fn__ledger-type--unlock     { background: rgba(255, 226, 122, 0.15); color: var(--color-gold-1); }
    .fn__ledger-type--coin_pack  { background: rgba(255, 31, 90, 0.15); color: var(--color-accent-1); }
    .fn__ledger-type--rewarded   { background: rgba(46, 212, 122, 0.15); color: var(--color-success); }
    .fn__ledger-type--vip        { background: rgba(178, 0, 43, 0.15); color: var(--color-accent-2); }
    .fn__ledger-type--payout     { background: rgba(255, 56, 56, 0.15); color: var(--color-error); }
    .fn__ledger-ref { font-size: 12px; }
    .fn__ledger-ref-lbl { font-size: 10px; color: var(--color-text-3); margin-top: 2px; }
    .fn__ledger-amt { font-weight: 800; font-size: var(--text-sm); font-variant-numeric: tabular-nums; text-align: right; }
    .fn__ledger-amt--neg { color: var(--color-error); }
    .fn__ledger-amt--pos { color: var(--color-success); }
  </style>
</head>
<body>
  <div id="chrome-topbar" data-title="Finance"></div>
  <div id="chrome-bottomnav"></div>

  <main class="screen" data-direction="forward">
    <div class="fn">
      <div class="fn__title">Finance & payouts</div>

      <div class="fn__revenue">
        <div class="fn__revenue-label">Net platform revenue (7d)</div>
        <div class="fn__revenue-val" id="net">₦0</div>
        <div class="fn__revenue-sub">Platform 40% of paid unlocks + ads + subs</div>
        <div class="fn__revenue-grid">
          <div><div class="fn__revenue-cell-val" id="gmv">₦0</div><div class="fn__revenue-cell-lbl">GMV</div></div>
          <div><div class="fn__revenue-cell-val" id="creator">₦0</div><div class="fn__revenue-cell-lbl">Creator 60%</div></div>
        </div>
      </div>

      <div class="fn__section">
        <div class="fn__section-title">
          <h2>Pending payouts</h2>
        </div>
        <div id="payouts"></div>
      </div>

      <div class="fn__section">
        <div class="fn__section-title">
          <h2>Recent ledger</h2>
        </div>
        <div class="fn__ledger" id="ledger"></div>
      </div>
    </div>
  </main>

  <script src="../scripts/data.js"></script>
  <script src="../scripts/app.js"></script>
  <script src="../scripts/chrome.js"></script>
  <script>
    if (vidashort.Storage.getRole() !== 'admin') vidashort.Storage.setRole('admin');
    const K = vidashort.MockData.adminKpis;
    document.getElementById('net').textContent = '₦' + K.platformRevenueNaira.toLocaleString();
    document.getElementById('gmv').textContent = '₦' + K.gmvNaira.toLocaleString();
    document.getElementById('creator').textContent = '₦' + K.creatorPayoutsNaira.toLocaleString();

    const payouts = document.getElementById('payouts');
    const pending = vidashort.MockData.payoutRequests.filter(p => p.status === 'pending');
    if (!pending.length) { payouts.innerHTML = '<div style="text-align:center; padding:16px; color:var(--color-text-3); font-size:13px;">No pending payouts.</div>'; }
    else {
      payouts.innerHTML = pending.map(p => {
        const creator = vidashort.MockData.getCreatorById(p.creatorId) || { name: p.creatorId, avatar: '' };
        return `
          <div class="fn__payout" data-id="${p.id}">
            <div class="fn__payout-head">
              <div class="fn__payout-avatar" style="background-image:url('${creator.avatar}');"></div>
              <div class="fn__payout-body">
                <div class="fn__payout-name">@${creator.handle}</div>
                <div class="fn__payout-detail">${p.method} ${p.account} • Requested ${p.requestedAt}</div>
              </div>
              <div class="fn__payout-amt">
                <div class="fn__payout-amt-val">₦${p.amountNaira.toLocaleString()}</div>
                <div class="fn__payout-amt-lbl">${p.amountCoins.toLocaleString()} coins</div>
              </div>
            </div>
            <div class="fn__payout-actions">
              <button class="fn__payout-btn fn__payout-btn--reject">Reject</button>
              <button class="fn__payout-btn fn__payout-btn--approve">Approve & pay</button>
            </div>
          </div>
        `;
      }).join('');
      payouts.querySelectorAll('.fn__payout-btn--approve').forEach(b => b.addEventListener('click', () => {
        vidashort.Haptics.success();
        vidashort.Toast.show('Payout sent. Creator notified.', 'success');
        vidashort.Confetti.burst({ originX: 50, originY: 30, count: 30 });
        b.closest('.fn__payout').style.opacity = '0.4';
        b.disabled = true;
        b.textContent = 'Paid';
      }));
      payouts.querySelectorAll('.fn__payout-btn--reject').forEach(b => b.addEventListener('click', () => {
        vidashort.Haptics.error();
        vidashort.Toast.show('Payout rejected', 'error');
        b.closest('.fn__payout').style.opacity = '0.4';
      }));
    }

    const ledger = document.getElementById('ledger');
    ledger.innerHTML = vidashort.MockData.adminLedger.map(l => {
      const cls = l.grossNaira < 0 ? 'fn__ledger-amt--neg' : 'fn__ledger-amt--pos';
      const sign = l.grossNaira < 0 ? '−' : '+';
      return `
        <div class="fn__ledger-row">
          <span class="fn__ledger-type fn__ledger-type--${l.type}">${l.type.replace('_', ' ')}</span>
          <div class="fn__ledger-ref">
            ${l.ref}
            <div class="fn__ledger-ref-lbl">${l.date} • ${l.refId}</div>
          </div>
          <div class="fn__ledger-amt ${cls}">${sign}₦${Math.abs(l.grossNaira).toLocaleString()}</div>
        </div>
      `;
    }).join('');
  </script>
</body>
</html>
